<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>Mapping India's clouds</title>
  <!-- Navy sky ground (matches the map's ink / night sky). -->
  <rect width="32" height="32" fill="#0B1D3A"/>
  <!-- Pixel cumulus: the map's tier-4 LOW glyph (sprites.ts), a fat lobed puff. -->
  <g fill="#FFFFFF">
    <rect x="12" y="6"  width="8"  height="4"/>
    <rect x="8"  y="10" width="16" height="4"/>
    <rect x="4"  y="14" width="24" height="8"/>
  </g>
  <!-- Pale shaded base row, inset 1 cell each side. -->
  <rect x="8" y="22" width="16" height="4" fill="#C4D8EC"/>
</svg>
