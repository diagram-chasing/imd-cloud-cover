name: Daily Meteogram Scraper

on:
  schedule:
    - cron: '30 5 * * *'  # Runs at 11:00 AM IST daily (5:30 AM UTC)
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write
  deployments: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape meteograms
        working-directory: scraper
        run: python pipeline.py scrape --out /tmp/run-results.json

      - name: Fetch MausamGram numerics
        working-directory: scraper
        run: python pipeline.py numeric

      - name: Aggregate derived views
        working-directory: scraper
        run: python pipeline.py aggregate --results /tmp/run-results.json

      - name: Export public dataset
        working-directory: scraper
        run: python pipeline.py export

      - name: Commit regenerated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "chore: regenerate public dataset [skip ci]"
            git push
          fi

      - name: Upload run report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: /tmp/run-results.json
          if-no-files-found: ignore

  deploy:
    needs: scrape
    uses: ./.github/workflows/netlify-pages-publish.yaml
    secrets: inherit
