name: Daily Meteogram Scraper

on:
  schedule:
    - cron: '30 5 * * *'  # Runs at 11:00 AM IST daily (5:30 AM UTC)
  workflow_dispatch:  # Allows manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape meteograms
        working-directory: scraper
        run: python main.py --out /tmp/run-results.json

      - name: Aggregate derived views
        working-directory: scraper
        run: python aggregate.py --results /tmp/run-results.json

      - name: Upload run report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: /tmp/run-results.json
          if-no-files-found: ignore

      # Netlify rebuilds the site (pnpm build re-bakes the core views) so the
      # deployed data is exactly as fresh as this run.
      - name: Trigger Netlify rebuild
        run: curl -sf -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
