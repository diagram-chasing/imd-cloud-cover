name: Daily Meteogram Scraper

on:
  schedule:
    - cron: '30 5 * * *'  # Runs at 11:00 AM IST daily (5:30 AM UTC)
  workflow_dispatch:  # Allows manual triggering

# Grant the token the permissions the reusable deploy workflow requires. A
# reusable workflow can never request more than its caller, so the caller must
# declare `deployments: write` here (the repo default is `deployments: none`).
# `contents: write` lets the scrape job commit the regenerated public dataset
# (data/) back to the repo.
permissions:
  contents: write
  deployments: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape meteograms
        working-directory: scraper
        run: python main.py --out /tmp/run-results.json

      - name: Aggregate derived views
        working-directory: scraper
        run: python aggregate.py --results /tmp/run-results.json

      # Regenerate the public dataset (data/*.parquet, *.csv, *.csv.zip) from the
      # freshly-aggregated histories in R2, so the committed dataset tracks each
      # run. export.py writes to repo-root data/ by default.
      - name: Export public dataset
        working-directory: scraper
        run: python export.py

      - name: Commit regenerated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "chore: regenerate public dataset [skip ci]"
            git push
          fi

      - name: Upload run report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: /tmp/run-results.json
          if-no-files-found: ignore

  # Once fresh data has landed in R2, hand off to the production deploy
  # workflow. It runs `pnpm build`, which re-bakes the core views from R2, so
  # the deployed site is exactly as fresh as this run — and both scheduled and
  # manual production deploys go through the same single code path.
  deploy:
    needs: scrape
    uses: ./.github/workflows/netlify-pages-preview.yaml
    secrets: inherit
