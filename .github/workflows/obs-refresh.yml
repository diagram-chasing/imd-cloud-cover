name: Obs Refresh

# Lightweight companion to the daily scrape: every 30 minutes, sample
# near-real-time observations (IMD INSAT CTBT image + MOSDAC OLR/HEM combined
# into one cloud grid, IMD synop WFS for observer oktas/rain) and write the
# small latest/obs.json sidecar + latest/sky.png to R2. The site reads it live
# through the Worker — no rebuild or deploy. ~5 upstream requests per run;
# every source is optional and a fully-failed run still writes a valid
# (empty) document.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obs-refresh
  cancel-in-progress: true

jobs:
  obs:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3 python-dotenv requests numpy Pillow

      - name: Collect observations
        working-directory: scraper
        run: python collect_obs.py
